name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No attestations: GitHub does not offer them on user-owned private repos.
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
